name: DPI Blocks tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.0"
          - "8.3"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer config
        run: composer validate --strict

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: composer test

  browser-definition:
    name: Playwright definition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        run: npm install

      - name: Validate Playwright config and tests
        run: npx playwright test --list

  default-styles:
    name: Default block styles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Render and verify real block defaults
        run: npm run test:styles
      - name: Upload block previews and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpi-default-styles-report
          path: test-results/
          retention-days: 7
