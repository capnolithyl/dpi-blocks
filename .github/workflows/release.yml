name: Release DPI Blocks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional version without the v prefix. Must match the plugin files.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Resolve release version
        id: release_meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PLUGIN_VERSION="$(php -r '
            $source = file_get_contents("dpi-blocks.php");
            preg_match("/^[[:space:]]*\\*[[:space:]]Version:[[:space:]]+([^[:space:]]+)/m", $source, $matches);
            echo $matches[1] ?? "";
          ')"

          README_VERSION="$(php -r '
            $source = file_get_contents("readme.txt");
            preg_match("/^Stable tag:[[:space:]]+([^[:space:]]+)/m", $source, $matches);
            echo $matches[1] ?? "";
          ')"

          METADATA_VERSION="$(php -r '
            $metadata = json_decode(file_get_contents("update.json"), true);
            echo $metadata["version"] ?? "";
          ')"

          METADATA_DOWNLOAD="$(php -r '
            $metadata = json_decode(file_get_contents("update.json"), true);
            echo $metadata["download_url"] ?? "";
          ')"

          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Plugin version must use x.y.z format."
            exit 1
          fi

          if [ "$README_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::readme.txt Stable tag is $README_VERSION but dpi-blocks.php is $PLUGIN_VERSION."
            exit 1
          fi

          if [ "$METADATA_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::update.json version is $METADATA_VERSION but dpi-blocks.php is $PLUGIN_VERSION."
            exit 1
          fi

          EXPECTED_DOWNLOAD="https://github.com/capnolithyl/dpi-blocks/releases/download/v$PLUGIN_VERSION/dpi-blocks.zip"
          if [ "$METADATA_DOWNLOAD" != "$EXPECTED_DOWNLOAD" ]; then
            echo "::error::update.json download_url must be $EXPECTED_DOWNLOAD."
            exit 1
          fi

          if [ -n "${REQUESTED_VERSION:-}" ] && [ "$REQUESTED_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match plugin version $PLUGIN_VERSION."
            exit 1
          fi

          TAG="v$PLUGIN_VERSION"
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet; publishing it."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        if: steps.release_meta.outputs.should_release == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        if: steps.release_meta.outputs.should_release == 'true'
        run: composer test

      - name: Prepare production dependencies
        if: steps.release_meta.outputs.should_release == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build installable plugin ZIP
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build dpi-blocks.zip
          mkdir -p build/dpi-blocks

          rsync -a ./ build/dpi-blocks/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.js' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.result.cache'

          (
            cd build
            zip -qr ../dpi-blocks.zip dpi-blocks
          )

          unzip -l dpi-blocks.zip | grep -q 'dpi-blocks/dpi-blocks.php'
          unzip -l dpi-blocks.zip | grep -q 'dpi-blocks/vendor/autoload.php'

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          gh release create "$TAG" dpi-blocks.zip \
            --target "$TARGET_SHA" \
            --title "DPI Blocks $VERSION" \
            --generate-notes
